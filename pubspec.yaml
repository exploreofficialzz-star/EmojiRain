name: emoji_rain
description: Emoji Rain - Focus or Fail. A fast-paced emoji tapping game.
publish_to: 'none'
version: 1.0.0+87

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Ads
  google_mobile_ads: ^5.0.0

  # In-App Purchases
  in_app_purchase: ^3.2.3

  # Real internet/data connection check
  internet_connection_checker_plus: ^2.5.1

  # Network type detection
  connectivity_plus: ^6.0.3

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Audio — existing game SFX/BGM
  audioplayers: ^6.1.0

  # Audio — beat mode track playback
  just_audio: ^0.9.37

  # Microphone — beat detection from ambient music
  record: ^5.0.0

  # Animations
  flutter_animate: ^4.5.0

  # Timezone (required by flutter_local_notifications)
  timezone: ^0.9.4

  # Storage
  shared_preferences: ^2.3.1

  # Icons
  cupertino_icons: ^1.0.8

  # Paystack — WebView-based inline popup.
  webview_flutter: ^4.10.0

  # Custom game background
  image_picker: ^1.1.2

  # Stable persistent file paths
  path_provider: ^2.1.4

  # Share result card (Phase 4)
  share_plus: ^7.2.1

  # HTTP — multiplayer room API + SSE streaming
  http: ^1.2.0

  # HTTP header/content-type parsing
  http_parser: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# ── Google Play Billing Library 8.x compliance ────────────────────────────────
dependency_overrides:
  in_app_purchase_android: 0.5.0
  in_app_purchase_storekit: 0.3.22+1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0a0a1a"
  adaptive_icon_foreground: "assets/images/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/audio/beats/
    - assets/adi-registration.properties
